name: reproduce-bootstrap-bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Start rootless Docker
        run: |
          dockerd-rootless-setuptool.sh install --force
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Read immutable builder identity
        run: |
          uv run --locked python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("manifests/bootstrap-v1.toml").read_text())
          print(f"FORZA_BUILDER_IMAGE={manifest['builder']['image']}")
          PY
      - name: Reproduce twice from exact public revisions
        run: |
          mkdir -m 0700 /tmp/forza-bundle-build-a /tmp/forza-bundle-build-b
          ./tools/build-bootstrap-bundle --clean \
            --builder-image "$FORZA_BUILDER_IMAGE" \
            --output /tmp/forza-bundle-build-a
          ./tools/build-bootstrap-bundle --clean \
            --builder-image "$FORZA_BUILDER_IMAGE" \
            --output /tmp/forza-bundle-build-b
          cmp /tmp/forza-bundle-build-a/forza-bootstrap-bundle-v1.tar.zst \
            /tmp/forza-bundle-build-b/forza-bootstrap-bundle-v1.tar.zst
          ./tools/verify-bootstrap-bundle \
            --manifest manifests/bootstrap-v1.toml \
            /tmp/forza-bundle-build-a/forza-bootstrap-bundle-v1.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forza-bootstrap-bundle-v1
          path: /tmp/forza-bundle-build-a/forza-bootstrap-bundle-v1.tar.zst
          if-no-files-found: error
          retention-days: 7
