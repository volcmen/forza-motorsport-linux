name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck systemd ripgrep
      - name: Install pinned shell formatter
        env:
          SHFMT_VERSION: "3.14.0"
          SHFMT_SHA256: "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66"
        run: |
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            --output "$RUNNER_TEMP/shfmt"
          printf '%s  %s\n' "$SHFMT_SHA256" "$RUNNER_TEMP/shfmt" | sha256sum --check --strict
          install -Dm755 "$RUNNER_TEMP/shfmt" "$RUNNER_TEMP/forza-tools/shfmt"
          echo "$RUNNER_TEMP/forza-tools" >> "$GITHUB_PATH"
      - name: Provide executable target for unit verification
        run: install -Dm755 /bin/true "$HOME/.local/libexec/xodus-forza/xodus-service"
      - name: Install Python verification tools
        run: uv sync --locked --group dev
      - name: Verify repository
        run: just verify
